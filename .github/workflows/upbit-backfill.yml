name: Two-year all-hours backfill
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upbit-backfill.yml'
  schedule:
    - cron: '20 1,7,13,19 * * *'
permissions:
  contents: write
concurrency:
  group: upbit-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Incremental historical backfill
        env:
          COINS_PER_RUN: '8'
        run: python scripts/backfill.py
      - name: Build and save trained pattern model
        run: python scripts/build_model.py
      - name: Commit completed historical samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: checkpoint 24-hour historical backfill"
            git push
          fi
