name: Sequence detector checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/sequence.test.cjs
      - run: node --check app.js && node --check sequence.js && node --check scripts/replay_sequence.cjs
