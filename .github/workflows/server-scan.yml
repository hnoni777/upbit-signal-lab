name: Background market scanner
on:
  # Recover a broken dispatch chain independently of the previous runner.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      chained:
        description: Unattended continuation
        required: false
        default: 'false'
  push:
    branches: [main]
    paths:
      - scripts/server_scan.cjs
      - scripts/continue_scan.cjs
      - sequence.js
      - detail.js
      - learner.cjs
      - recommend.js
      - .github/workflows/server-scan.yml
      - .github/server-control.json
permissions:
  contents: write
  actions: write
concurrency:
  group: upbit-server-scan
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.chained != 'true') }}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scanner control
        id: control
        run: |
          enabled=$(node -p 'require("./.github/server-control.json").enabled')
          if [ "$enabled" = true ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            git fetch --depth=1 origin server-data
            git show origin/server-data:data/server-state.json > "$RUNNER_TEMP/last-scan.json"
            enabled=$(node -e 'const s=require(process.argv[1]); console.log(!Number.isFinite(s.completedAt)||Date.now()-s.completedAt>=600000)' "$RUNNER_TEMP/last-scan.json")
            echo "Recovery scan needed: $enabled"
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "SCAN_STARTED_AT=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
      - name: Verify detector and server transitions
        if: steps.control.outputs.enabled == 'true'
        run: node --test tests/*.test.cjs
      - name: Load durable server state
        if: steps.control.outputs.enabled == 'true'
        run: |
          git fetch --depth=1 origin server-data
          git show origin/server-data:data/server-state.json > data/server-state.json
          if git cat-file -e origin/server-data:data/learning.json 2>/dev/null; then
            git show origin/server-data:data/learning.json > data/learning.json
          fi
      - name: Analyze all current KRW pairs
        if: steps.control.outputs.enabled == 'true'
        env:
          RUN_CHAINED: ${{ github.event.inputs.chained }}
        run: node scripts/server_scan.cjs data/server-state.json data/server-state.json
      - name: Persist results without rebuilding the app
        if: steps.control.outputs.enabled == 'true'
        run: |
          git worktree add --detach "$RUNNER_TEMP/server-publish" origin/server-data
          mkdir -p "$RUNNER_TEMP/server-publish/data"
          cp data/server-state.json "$RUNNER_TEMP/server-publish/data/server-state.json"
          cp data/learning.json "$RUNNER_TEMP/server-publish/data/learning.json"
          cd "$RUNNER_TEMP/server-publish"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/server-state.json data/learning.json
          if ! git diff --cached --quiet; then
            git commit -m 'server: update all-market snapshot and observations'
            for attempt in 1 2 3; do
              if git push origin HEAD:server-data; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 5
            done
          fi
      - name: Continue background analysis
        if: ${{ !cancelled() && steps.control.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if node scripts/continue_scan.cjs; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
